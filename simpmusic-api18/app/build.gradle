plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maxrave.simpmusic.legacy'
    compileSdk 35

    sourceSets.main.java.srcDirs += ['../third_party/nanojson/java']

    defaultConfig {
        applicationId 'com.maxrave.simpmusic.legacy'
        minSdk 18
        targetSdk 28
        versionCode 2
        versionName '0.2.0-api18-online'
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}


dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation files('libs/newpipe-extractor-0.26.1.jar')
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.protobuf:protobuf-javalite:4.34.1'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'org.mozilla:rhino-engine:1.8.1'
    implementation 'ch.randelshofer:fastdoubleparser:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
